name: Compile PDFs

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Install fonts
      run: |
        apt update
        apt install --yes \
          fonts-roboto \
          fontconfig \
          git \
          ;
        git clone --depth 1 https://github.com/adobe-fonts/source-sans.git /tmp/source-sans
        cp /tmp/source-sans/OTF/*.otf /usr/local/share/fonts/
        fc-cache -f -v

    - name: Compile
      run: make

    - uses: actions/upload-artifact@v6
      with:
        name: cv-pdf
        path: compiled/cv.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: resume-pdf
        path: compiled/resume.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: coverletter-pdf
        path: compiled/coverletter.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: compiled
        path: compiled/*.pdf
